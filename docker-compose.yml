version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: defender_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: defender_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defender_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: defender_bot_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@postgres:5432/defender_bot
      WEB_ADMIN_ENABLED: "false"
    volumes:
      - ./logs:/app/logs
    command: python -m app.main

  admin:
    build: .
    container_name: defender_bot_web_admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@postgres:5432/defender_bot
      WEB_ADMIN_ENABLED: "true"
      WEB_ADMIN_HOST: 0.0.0.0
      WEB_ADMIN_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    command: python -m app.web_main

volumes:
  postgres_data:
